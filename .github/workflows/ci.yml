name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  ZIG_VERSION: 0.17.1
  ZIG_SHA256: 3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Zig
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/zig.tar.xz" \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          echo "${ZIG_SHA256}  $RUNNER_TEMP/zig.tar.xz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" --strip-components=1 -C "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install SDL2 and tutorial tools
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev patch
      - name: Build
        run: zig build
      - name: Build and inspect Linux release candidates (P42-01)
        run: |
          zig build release-linux
          python3 tools/package_linux_release.py
      - name: Test engine and proofs
        run: zig build test
      - name: Fuzz engine input boundaries
        run: zig build test-fuzz --test-timeout 10s
      - name: Run the language conformance suite (P48-18)
        run: zig build test-conformance
      - name: Test generated project
        run: zig build test-template
      - name: Follow the first-game tutorial (P40-02)
        timeout-minutes: 8
        env:
          CHROME: google-chrome
        run: python3 tools/check_tutorial.py
      - name: Test Lantern Watch through the parser
        timeout-minutes: 8
        env:
          CHROME: google-chrome
        run: python3 tools/build_lantern_watch.py --chrome "$RUNNER_TEMP/lantern-watch/index.html"
      - name: Test The Sunken Vault classic parser adventure (P49-03)
        timeout-minutes: 8
        env:
          CHROME: google-chrome
        run: python3 tools/build_sunken_vault.py --chrome "$RUNNER_TEMP/sunken-vault/index.html"
      - name: Build and smoke-test WebAssembly
        run: |
          zig build wasm wasm-proofs
          node tools/wasm_smoke.js
          python3 tools/package_browser_release.py
      - name: Check browser size budgets (P41-01)
        run: python3 tools/check_web_budgets.py --lantern-page "$RUNNER_TEMP/lantern-watch/index.html" --sunken-vault-page "$RUNNER_TEMP/sunken-vault/index.html"
      - name: Measure simulation on Linux and in Chrome (P41-01)
        timeout-minutes: 5
        env:
          CHROME: google-chrome
          BESPOKE_BENCH_CHROME_NO_SANDBOX: "1"
        run: zig build bench
      - name: Verify and benchmark the Harbour reference game (P41-02)
        timeout-minutes: 5
        env:
          CHROME: google-chrome
          BESPOKE_BENCH_CHROME_NO_SANDBOX: "1"
        run: zig build harbour
      - name: Check editor grammar (P40-03)
        run: python3 tools/build_editor_grammar.py --check
      - name: Test Python tools
        run: python3 -m unittest discover -s tests -v
      - name: Check documentation
        run: python3 tools/check_docs.py
      - name: Check generated site
        run: python3 tools/build_site.py --check
      - name: Open a proof page in Chrome
        env:
          CHROME: google-chrome
        run: |
          node tools/browser_smoke.js
          node tools/browser_smoke.js --showcase-layout
      - name: Check the showcase touch targets
        env:
          CHROME: google-chrome
        run: node tools/browser_smoke.js --touch-targets

<script>
// The Studio's window layer (P47-01, D-192): screens, windows, gadgets, held menus, requesters,
// and one message queue per window. Studio code only; the engine has no windowing module
// (D-192 item 4). Every label is drawn in the engine's 5x7 face from the table the build bakes
// in (D-192 item 7), so this layer runs before, and without, the compiler module (item 5).
'use strict';

// Glyph rows are bits 0..6 of each column byte, top to bottom; columns are 5 wide with one
// column of spacing, as `font.char_width` draws them in the engine.
const GLYPH_W = 5;
const GLYPH_H = 7;
const ADVANCE = 6;

function createDesk(root, fontTable) {
  const glyphs = fontTable.glyphs;
  const placeholder = glyphs[fontTable.placeholder];
  const pathCache = new Map();
  const log = [];
  const screens = [];
  let activeWin = null;
  let menuState = null;

  // ---------------------------------------------------------------- text

  function codepoints(text) {
    const out = [];
    for (const ch of String(text)) out.push(ch.codePointAt(0));
    return out;
  }

  // One SVG path per text: each glyph column becomes vertical runs, so a label is a handful of
  // rectangles that CSS colours (fill: currentColor) and scales (--px) without redrawing.
  function textPath(text) {
    const hit = pathCache.get(text);
    if (hit) return hit;
    let d = '';
    let x = 0;
    let count = 0;
    for (const cp of codepoints(text)) {
      count += 1;
      if (cp === 9 || cp === 32) { x += ADVANCE; continue; }
      const cols = cp < 32 || cp === 127 ? null : (glyphs[cp] || placeholder);
      if (cols) {
        for (let c = 0; c < GLYPH_W; c += 1) {
          let r = 0;
          while (r < GLYPH_H) {
            if (!((cols[c] >> r) & 1)) { r += 1; continue; }
            const start = r;
            while (r < GLYPH_H && ((cols[c] >> r) & 1)) r += 1;
            d += `M${x + c} ${start}h1v${r - start}h-1z`;
          }
        }
      }
      x += ADVANCE;
    }
    const out = { d, width: Math.max(1, count * ADVANCE - 1) };
    if (pathCache.size > 4000) pathCache.clear();
    pathCache.set(text, out);
    return out;
  }

  const SVG = 'http://www.w3.org/2000/svg';

  // A label: the pixel text for the eye and a visually hidden copy for screen readers, search,
  // and the accessible name of the gadget it sits in.
  function label(text, cls = '') {
    const wrap = document.createElement('span');
    wrap.className = `label ${cls}`.trim();
    setLabel(wrap, text);
    return wrap;
  }

  function setLabel(wrap, text) {
    const t = String(text);
    if (wrap.dataset.text === t && wrap.firstChild) return;
    wrap.dataset.text = t;
    const { d, width } = textPath(t);
    const svg = document.createElementNS(SVG, 'svg');
    svg.setAttribute('class', 'px');
    svg.setAttribute('viewBox', `0 0 ${width} ${GLYPH_H}`);
    svg.setAttribute('aria-hidden', 'true');
    svg.style.setProperty('--w', width);
    const path = document.createElementNS(SVG, 'path');
    path.setAttribute('d', d);
    svg.appendChild(path);
    const sr = document.createElement('span');
    sr.className = 'sr';
    sr.textContent = t;
    wrap.replaceChildren(svg, sr);
  }

  // Splits `text` into lines of at most `cols` characters, at spaces where it can.
  function wrapText(text, cols) {
    const lines = [];
    for (const para of String(text).split('\n')) {
      let line = '';
      for (const word of para.split(' ')) {
        let w = word;
        while ([...w].length > cols) {
          if (line) { lines.push(line); line = ''; }
          const chars = [...w];
          lines.push(chars.slice(0, cols).join(''));
          w = chars.slice(cols).join('');
        }
        if (!line) line = w;
        else if ([...line].length + 1 + [...w].length <= cols) line += ` ${w}`;
        else { lines.push(line); line = w; }
      }
      lines.push(line);
    }
    return lines;
  }

  function px() {
    return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--px')) || 2;
  }

  // ---------------------------------------------------------------- messages

  // One queue per window, drained in order after the event that posted to it. A handler never
  // runs inside a DOM event, so a handler that opens a requester or closes its own window sees
  // a settled layout, and messages a handler posts wait their turn.
  class Port {
    constructor(win) {
      this.win = win;
      this.queue = [];
      this.draining = false;
    }
    post(msg) {
      const full = { ...msg, window: this.win.id, at: performance.now() };
      log.push(full);
      if (log.length > 100) log.shift();
      this.queue.push(full);
      if (!this.draining) {
        this.draining = true;
        queueMicrotask(() => this.drain());
      }
    }
    async drain() {
      while (this.queue.length) {
        const msg = this.queue.shift();
        try {
          if (this.win.onMessage) await this.win.onMessage(msg);
        } catch (err) {
          desk.onHandlerError(err, msg);
        }
      }
      this.draining = false;
    }
  }

  // ---------------------------------------------------------------- gadgets

  function gadget(text, opts = {}) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = `gad ${opts.cls || ''}`.trim();
    if (opts.id) b.dataset.gadget = opts.id;
    if (opts.title) b.setAttribute('aria-label', opts.title);
    if (text !== null) b.appendChild(label(text));
    if (opts.onPick) b.addEventListener('click', (e) => { e.stopPropagation(); opts.onPick(); });
    return b;
  }

  // A gadget whose release posts { kind: 'gadget', id } to its window's port.
  function button(win, id, text, opts = {}) {
    return gadget(text, { ...opts, id, onPick: () => win.port.post({ kind: 'gadget', id }) });
  }

  // A vertical proportional gadget: knob size is the visible share, position the offset. It
  // reports with `onMove(top)` and is driven with `set(total, visible, top)`.
  function propGadget(onMove) {
    const track = document.createElement('div');
    track.className = 'prop';
    track.setAttribute('role', 'scrollbar');
    track.setAttribute('aria-orientation', 'vertical');
    const knob = document.createElement('div');
    knob.className = 'knob';
    track.appendChild(knob);
    const state = { total: 1, visible: 1, top: 0 };
    function layout() {
      const share = Math.min(1, state.visible / Math.max(1, state.total));
      const span = Math.max(0, state.total - state.visible);
      knob.style.height = `${share * 100}%`;
      knob.style.top = `${span ? (state.top / span) * (1 - share) * 100 : 0}%`;
      track.setAttribute('aria-valuemax', String(span));
      track.setAttribute('aria-valuenow', String(state.top));
      track.classList.toggle('full', share >= 1);
    }
    function moveTo(top) {
      const span = Math.max(0, state.total - state.visible);
      const t = Math.max(0, Math.min(span, Math.round(top)));
      if (t !== state.top) { state.top = t; layout(); onMove(t); }
    }
    knob.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      knob.setPointerCapture(e.pointerId);
      const startY = e.clientY;
      const startTop = state.top;
      const h = track.getBoundingClientRect().height;
      const span = Math.max(1, state.total - state.visible);
      const free = Math.max(1, h * (1 - Math.min(1, state.visible / state.total)));
      const move = (ev) => moveTo(startTop + ((ev.clientY - startY) / free) * span);
      const up = () => { knob.removeEventListener('pointermove', move); knob.removeEventListener('pointerup', up); };
      knob.addEventListener('pointermove', move);
      knob.addEventListener('pointerup', up);
    });
    track.addEventListener('pointerdown', (e) => {
      if (e.target !== track) return;
      const k = knob.getBoundingClientRect();
      moveTo(state.top + (e.clientY < k.top ? -state.visible : state.visible));
    });
    return {
      el: track,
      set(total, visible, top) { Object.assign(state, { total, visible, top }); layout(); },
      moveTo,
      get top() { return state.top; },
    };
  }

  // ---------------------------------------------------------------- windows

  let nextId = 1;

  class Win {
    constructor(screen, opts) {
      this.screen = screen;
      this.id = opts.id || `win${nextId++}`;
      this.onMessage = opts.onMessage || null;
      this.port = new Port(this);
      this.minW = opts.minW || 120;
      this.minH = opts.minH || 60;
      this.zoomed = null;
      this.requesters = 0;

      const el = document.createElement('section');
      el.className = 'win';
      el.dataset.window = this.id;
      el.setAttribute('aria-label', opts.title);
      this.el = el;

      const bar = document.createElement('div');
      bar.className = 'bar';
      this.bar = bar;
      if (opts.closable !== false) {
        bar.appendChild(gadget(null, { cls: 'g-close', title: `Close ${opts.title}`, onPick: () => this.port.post({ kind: 'close' }) }));
      }
      this.titleLabel = label(opts.title, 'title');
      bar.appendChild(this.titleLabel);
      const right = document.createElement('span');
      right.className = 'bar-right';
      if (opts.zoomable !== false) right.appendChild(gadget(null, { cls: 'g-zoom', title: `Zoom ${opts.title}`, onPick: () => this.zoom() }));
      right.appendChild(gadget(null, { cls: 'g-depth', title: `Depth ${opts.title}`, onPick: () => this.depth() }));
      bar.appendChild(right);
      el.appendChild(bar);

      this.body = document.createElement('div');
      this.body.className = 'body';
      el.appendChild(this.body);

      if (opts.sizable !== false) {
        const size = document.createElement('div');
        size.className = 'g-size';
        size.setAttribute('aria-hidden', 'true');
        size.addEventListener('pointerdown', (e) => this.dragSize(e));
        el.appendChild(size);
      }

      bar.addEventListener('pointerdown', (e) => this.dragMove(e));
      el.addEventListener('pointerdown', () => this.activate(), true);
      el.addEventListener('focusin', () => this.activate());

      screen.area.appendChild(el);
      this.place(opts.x ?? 24, opts.y ?? 24, opts.w ?? 360, opts.h ?? 200);
      screen.windows.push(this);
      if (screen.narrow()) this.fill();
      this.activate();
    }

    place(x, y, w, h) {
      const a = this.screen.area.getBoundingClientRect();
      const W = Math.max(this.minW, Math.min(w, a.width));
      const H = Math.max(this.minH, Math.min(h, a.height));
      this.rect = {
        x: Math.max(0, Math.min(x, a.width - W)),
        y: Math.max(0, Math.min(y, a.height - H)),
        w: W,
        h: H,
      };
      Object.assign(this.el.style, {
        left: `${this.rect.x}px`, top: `${this.rect.y}px`, width: `${this.rect.w}px`, height: `${this.rect.h}px`,
      });
    }

    fill() {
      const a = this.screen.area.getBoundingClientRect();
      this.place(0, 0, a.width, a.height);
    }

    setTitle(text) {
      setLabel(this.titleLabel, text);
      this.el.setAttribute('aria-label', text);
    }

    activate() {
      if (activeWin === this) return;
      const prev = activeWin;
      activeWin = this;
      if (prev) {
        prev.el.classList.remove('active');
        prev.port.post({ kind: 'deactivate' });
      }
      this.el.classList.add('active');
      this.port.post({ kind: 'activate' });
    }

    toFront() { this.screen.area.appendChild(this.el); }
    toBack() { this.screen.area.insertBefore(this.el, this.screen.area.firstChild); }

    // The depth gadget: to the back when already in front, otherwise to the front.
    depth() {
      if (this.screen.area.lastElementChild === this.el) this.toBack(); else this.toFront();
    }

    // The zoom gadget swaps between the window's place and a second remembered place, which
    // starts as the whole screen.
    zoom() {
      const a = this.screen.area.getBoundingClientRect();
      const other = this.zoomed || { x: 0, y: 0, w: a.width, h: a.height };
      this.zoomed = { ...this.rect };
      this.place(other.x, other.y, other.w, other.h);
      this.port.post({ kind: 'resize', w: this.rect.w, h: this.rect.h });
    }

    close() {
      this.el.remove();
      const list = this.screen.windows;
      list.splice(list.indexOf(this), 1);
      if (activeWin === this) {
        activeWin = null;
        const next = list[list.length - 1];
        if (next) next.activate();
      }
    }

    dragMove(e) {
      if (e.button !== 0 || e.target.closest('.gad')) return;
      e.preventDefault();
      this.bar.setPointerCapture(e.pointerId);
      const sx = e.clientX - this.rect.x;
      const sy = e.clientY - this.rect.y;
      const move = (ev) => this.place(ev.clientX - sx, ev.clientY - sy, this.rect.w, this.rect.h);
      const up = () => { this.bar.removeEventListener('pointermove', move); this.bar.removeEventListener('pointerup', up); };
      this.bar.addEventListener('pointermove', move);
      this.bar.addEventListener('pointerup', up);
    }

    dragSize(e) {
      if (e.button !== 0) return;
      e.preventDefault();
      e.stopPropagation();
      const g = e.currentTarget;
      g.setPointerCapture(e.pointerId);
      const sx = e.clientX - this.rect.w;
      const sy = e.clientY - this.rect.h;
      const move = (ev) => this.place(this.rect.x, this.rect.y, ev.clientX - sx, ev.clientY - sy);
      const up = () => {
        g.removeEventListener('pointermove', move);
        g.removeEventListener('pointerup', up);
        this.port.post({ kind: 'resize', w: this.rect.w, h: this.rect.h });
      };
      g.addEventListener('pointermove', move);
      g.addEventListener('pointerup', up);
    }
  }

  // ---------------------------------------------------------------- requesters

  // A requester blocks its window until answered and resolves with the id of the gadget
  // picked. Return answers the first gadget, Escape the last, as the period's left-yes,
  // right-no layout reads.
  function requester(win, { title, lines = [], buttons = [{ id: 'ok', label: 'OK' }], tone = 'info' }) {
    return new Promise((resolve) => {
      const veil = document.createElement('div');
      veil.className = 'veil';
      const box = document.createElement('div');
      box.className = `req req-${tone}`;
      box.setAttribute('role', 'alertdialog');
      box.setAttribute('aria-label', title);
      const head = document.createElement('div');
      head.className = 'req-title';
      head.appendChild(label(title));
      box.appendChild(head);
      const text = document.createElement('div');
      text.className = 'req-text';
      const cols = Math.max(16, Math.floor((win.rect.w * 0.9 - 8 * px()) / (ADVANCE * px())));
      for (const line of lines) {
        for (const part of wrapText(line, cols)) {
          const row = document.createElement('div');
          row.className = 'line';
          row.appendChild(label(part));
          text.appendChild(row);
        }
      }
      box.appendChild(text);
      const row = document.createElement('div');
      row.className = 'req-buttons';
      const finish = (id) => {
        veil.remove();
        win.requesters -= 1;
        win.el.classList.toggle('blocked', win.requesters > 0);
        win.port.post({ kind: 'requester', id });
        resolve(id);
      };
      for (const b of buttons) row.appendChild(gadget(b.label, { id: b.id, onPick: () => finish(b.id) }));
      box.appendChild(row);
      box.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finish(buttons[buttons.length - 1].id); }
      });
      veil.appendChild(box);
      win.requesters += 1;
      win.el.classList.add('blocked');
      win.el.appendChild(veil);
      win.activate();
      row.firstChild.focus();
    });
  }

  // ---------------------------------------------------------------- screens and menus

  class Screen {
    constructor(title) {
      this.windows = [];
      this.menus = [];
      const el = document.createElement('div');
      el.className = 'screen';
      this.el = el;
      const bar = document.createElement('div');
      bar.className = 'sbar';
      this.titleLabel = label(title, 'stitle');
      this.menuButton = gadget('Menus', { cls: 'g-menus', onPick: () => openMenus(this, 'sticky') });
      this.strip = document.createElement('div');
      this.strip.className = 'strip';
      this.strip.setAttribute('role', 'menubar');
      const right = document.createElement('span');
      right.className = 'bar-right';
      right.appendChild(gadget(null, { cls: 'g-depth', title: 'Screen to back', onPick: () => this.depth() }));
      bar.append(this.menuButton, this.titleLabel, this.strip, right);
      this.bar = bar;
      this.area = document.createElement('div');
      this.area.className = 'area';
      el.append(bar, this.area);
      root.appendChild(el);
      screens.push(this);
      this.offset = 0;

      // The secondary button opens the menu strip while it is held (desktop pointers); the
      // browser's own context menu never shows on a screen.
      el.addEventListener('contextmenu', (e) => e.preventDefault());
      el.addEventListener('pointerdown', (e) => {
        if (e.button === 2 && e.pointerType === 'mouse') { e.preventDefault(); openMenus(this, 'held', e); }
      });
      bar.addEventListener('pointerdown', (e) => this.dragScreen(e));
      bar.addEventListener('dblclick', (e) => { if (!e.target.closest('.gad')) this.slide(0); });
    }

    narrow() { return window.matchMedia('(max-width: 700px)').matches; }

    setTitle(text) { setLabel(this.titleLabel, text); }

    // Screens slide down by their title bar to show what is behind them, and spring back to
    // the top on a double click.
    dragScreen(e) {
      if (e.button !== 0 || e.target.closest('.gad') || menuState) return;
      e.preventDefault();
      this.bar.setPointerCapture(e.pointerId);
      const start = e.clientY - this.offset;
      const move = (ev) => this.slide(ev.clientY - start);
      const up = () => { this.bar.removeEventListener('pointermove', move); this.bar.removeEventListener('pointerup', up); };
      this.bar.addEventListener('pointermove', move);
      this.bar.addEventListener('pointerup', up);
    }

    slide(y) {
      const max = Math.max(0, window.innerHeight - this.bar.getBoundingClientRect().height);
      this.offset = Math.max(0, Math.min(max, y));
      this.el.style.transform = this.offset ? `translateY(${this.offset}px)` : '';
    }

    depth() {
      if (screens.length < 2) { this.slide(this.offset ? 0 : window.innerHeight * 0.5); return; }
      root.insertBefore(this.el, root.firstChild);
    }

    setMenus(menus) { this.menus = menus; }
  }

  function closeMenus(pick) {
    if (!menuState) return;
    const { screen, onDoc } = menuState;
    screen.bar.classList.remove('menus-open');
    screen.strip.replaceChildren();
    document.removeEventListener('pointerup', onDoc, true);
    document.removeEventListener('pointerdown', onDoc, true);
    document.removeEventListener('keydown', onDoc, true);
    menuState = null;
    if (pick) desk.pickMenu(pick);
  }

  // `held`: the strip lives while the secondary button is down and the item under the pointer
  // at release is picked. `sticky`: a tap opens it, a tap on an item picks, a tap outside or
  // Escape closes. Touch and keyboard users get sticky menus; the items are the same.
  function openMenus(screen, mode) {
    if (menuState) { closeMenus(); if (mode === 'sticky') return; }
    screen.bar.classList.add('menus-open');
    const strip = screen.strip;
    let openTitle = null;
    const titles = [];
    const items = new Map();
    for (const menu of screen.menus) {
      const t = gadget(menu.title, { cls: 'm-title' });
      t.setAttribute('role', 'menuitem');
      t.setAttribute('aria-haspopup', 'true');
      const drop = document.createElement('div');
      drop.className = 'drop';
      drop.setAttribute('role', 'menu');
      for (const item of menu.items) {
        const it = gadget(null, { cls: 'm-item', id: item.id });
        it.setAttribute('role', 'menuitem');
        it.appendChild(label(item.label, 'm-label'));
        if (item.key) it.appendChild(label(desk.keyName(item), 'm-key'));
        if (item.checked) it.classList.add('checked');
        if (item.disabled) it.classList.add('disabled');
        items.set(it, item);
        it.addEventListener('click', (e) => { e.stopPropagation(); if (mode === 'sticky') closeMenus(item.disabled ? null : item); });
        drop.appendChild(it);
      }
      const show = () => {
        if (openTitle === t) return;
        for (const other of titles) other.classList.remove('open');
        t.classList.add('open');
        openTitle = t;
      };
      t.addEventListener('pointerenter', show);
      t.addEventListener('click', (e) => { e.stopPropagation(); show(); });
      t.appendChild(drop);
      titles.push(t);
      strip.appendChild(t);
    }
    // Held menus show each title's items as the pointer crosses it, so a drag across the strip
    // reads every menu without a click; drops are children of their titles for that reason.
    const onDoc = (e) => {
      if (e.type === 'keydown') {
        if (e.key === 'Escape') { e.preventDefault(); closeMenus(); }
        return;
      }
      // The document hears the release first (capture), so it reads the item under the
      // pointer itself rather than waiting for the item's own listener.
      if (mode === 'held' && e.type === 'pointerup') {
        const under = document.elementFromPoint(e.clientX, e.clientY);
        const item = items.get(under && under.closest('.m-item'));
        closeMenus(item && !item.disabled ? item : null);
        return;
      }
      if (mode === 'sticky' && e.type === 'pointerdown' && !e.target.closest('.strip, .g-menus')) closeMenus();
    };
    menuState = { screen, onDoc };
    document.addEventListener('pointerup', onDoc, true);
    document.addEventListener('pointerdown', onDoc, true);
    document.addEventListener('keydown', onDoc, true);
    if (mode === 'sticky' && titles[0]) { titles[0].classList.add('open'); openTitle = titles[0]; titles[0].focus(); }
  }

  // ---------------------------------------------------------------- the fault panel

  // A failed mode reports here before the Studio falls back to its workspace (D-192 item 5):
  // a bordered panel across the top of the screen that waits for a click, Return, or Escape.
  // The border blinks unless the reader asked for reduced motion.
  function fault(lines) {
    return new Promise((resolve) => {
      const panel = document.createElement('div');
      panel.className = 'fault';
      panel.setAttribute('role', 'alert');
      panel.tabIndex = 0;
      for (const line of lines) {
        const row = document.createElement('div');
        row.className = 'line';
        row.appendChild(label(line));
        panel.appendChild(row);
      }
      const done = () => { panel.remove(); resolve(); };
      panel.addEventListener('click', done);
      panel.addEventListener('keydown', (e) => { if (['Enter', 'Escape', ' '].includes(e.key)) { e.preventDefault(); done(); } });
      root.appendChild(panel);
      panel.focus();
    });
  }

  const desk = {
    label, setLabel, wrapText, button, gadget, propGadget, requester, fault, px,
    screen: (title) => new Screen(title),
    window: (screen, opts) => new Win(screen, opts),
    get activeWindow() { return activeWin; },
    get menuOpen() { return Boolean(menuState); },
    log,
    // Set by the app: where a menu pick goes, how a key is named, what a handler error does.
    pickMenu: () => {},
    keyName: (item) => item.key,
    onHandlerError: (err) => console.error(err),
    advance: ADVANCE,
    glyphHeight: GLYPH_H,
  };
  return desk;
}
</script>
<script>
// BeSpoke Studio, P47-01 (D-151, D-192): the workspace screen, a project window that opens a
// folder or files, checks a script with the engine's compiler, and shows its diagnostics in
// place. No editors yet. The Studio keeps no project state of its own (D-151 item 6): files are
// held as the bytes read from disk and nothing is written back unless an editor changed it.
//
// Failed modes fall back to a working screen (D-192 item 5): the workspace and its windows
// depend only on this page's script and the baked font table. The compiler module, a saved
// setting, a project file, and every handler can fail; each failure is shown, and the author is
// left at a workspace that still opens, checks, and saves what it can.
'use strict';

(function studio() {
  const SCALE_KEY = 'bespoke.studio.scale';
  const SCALES = [1, 2, 3];
  const DEFAULT_SCALE = 2;
  // What a project folder contributes: scripts and the images they name. Everything else in
  // the folder is never read and never written, so it stays byte-identical by construction.
  const KEEP = /\.(bespoke|png)$/i;
  const SKIP_DIRS = new Set(['zig-out', '.zig-cache', 'zig-cache', 'node_modules']);
  // The compiler expands at most 256 files (includes.MAX_FILES) and 16 MiB of source; a PNG may
  // be 16 MiB (png.MAX_FILE). The total keeps one page's memory bounded.
  const MAX_FILES = 256;
  const MAX_FILE_BYTES = 16 * 1024 * 1024;
  const MAX_TOTAL_BYTES = 64 * 1024 * 1024;
  const MAX_DEPTH = 8;

  const S = {
    ready: false,
    scale: DEFAULT_SCALE,
    storage: true,
    compiler: { state: 'loading', error: '' },
    project: null,
    result: null,
    faults: [],
  };

  const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent || '');
  const root = document.getElementById('studio');
  const desk = createDesk(root, STUDIO_FONT);
  desk.keyName = (item) => `${isMac ? 'Cmd' : 'Ctrl'} ${item.key}`;

  // ------------------------------------------------------------ faults

  let faultShowing = null;
  function reportFault(lines) {
    S.faults.push(lines.join(' '));
    // One panel at a time; a burst of failures adds up behind it instead of stacking panels.
    if (faultShowing) return faultShowing;
    faultShowing = desk.fault([...lines, 'The workspace is still running. Click to go on.']).then(() => { faultShowing = null; });
    return faultShowing;
  }
  desk.onHandlerError = (err) => reportFault(['A Studio window stopped on an error:', errText(err)]);
  window.addEventListener('error', (e) => reportFault(['The Studio hit an error:', e.message || 'unknown error']));
  window.addEventListener('unhandledrejection', (e) => reportFault(['The Studio hit an error:', errText(e.reason)]));

  function errText(err) {
    if (!err) return 'unknown error';
    return String(err.message || err).slice(0, 200);
  }

  // ------------------------------------------------------------ settings

  function applyScale(n) {
    S.scale = n;
    document.documentElement.style.setProperty('--px', `${n}px`);
  }

  // A saved setting the page cannot use is reported and replaced by the default for this visit;
  // the saved value is only overwritten when the author picks a scale.
  function loadSettings() {
    let raw = null;
    try { raw = window.localStorage.getItem(SCALE_KEY); } catch { S.storage = false; }
    if (raw === null) { applyScale(DEFAULT_SCALE); return null; }
    const n = Number(raw);
    if (SCALES.includes(n)) { applyScale(n); return null; }
    applyScale(DEFAULT_SCALE);
    return raw;
  }

  function saveScale(n) {
    applyScale(n);
    try { window.localStorage.setItem(SCALE_KEY, String(n)); } catch { S.storage = false; }
    screen.setMenus(menus());
    for (const w of screen.windows) w.port.post({ kind: 'resize', w: w.rect.w, h: w.rect.h });
  }

  // ------------------------------------------------------------ the compiler

  let wasm = null;

  async function startCompiler() {
    S.compiler = { state: 'loading', error: '' };
    renderProject();
    try {
      if (typeof WebAssembly === 'undefined') throw new Error('this browser has no WebAssembly');
      if (!STUDIO_BUILD.wasm) throw new Error('this page was built without its compiler');
      const bytes = Uint8Array.from(atob(STUDIO_BUILD.wasm), (c) => c.charCodeAt(0));
      const { instance } = await WebAssembly.instantiate(bytes, {});
      wasm = instance.exports;
      S.compiler = { state: 'ready', error: '' };
    } catch (err) {
      stopCompiler(err, 'did not start');
      return false;
    }
    renderProject();
    return true;
  }

  // A trap inside the module (out of memory, a bug) ends that instance; the Studio keeps going
  // without it, says so, and offers Retry, which starts a fresh instance.
  function stopCompiler(err, how) {
    wasm = null;
    S.compiler = { state: 'unavailable', error: errText(err) };
    renderProject();
    reportFault([`The compiler ${how}: ${errText(err)}`, 'You can still open projects and save. Retry is in the Project window.']);
  }

  function withCompiler(fn) {
    if (!wasm) return null;
    try { return fn(wasm); } catch (err) { stopCompiler(err, 'stopped'); return null; }
  }

  const enc = new TextEncoder();
  function put(x, bytes) {
    const len = Math.max(1, bytes.length);
    const ptr = x.studio_alloc(len);
    if (!ptr) throw new Error('the compiler ran out of memory');
    new Uint8Array(x.memory.buffer, ptr, bytes.length).set(bytes);
    return { ptr, len, used: bytes.length };
  }

  function loadIntoCompiler() {
    return withCompiler((x) => {
      x.studio_reset();
      for (const f of S.project.files) {
        const p = put(x, enc.encode(f.path));
        const d = put(x, f.bytes);
        const ok = x.studio_add_file(p.ptr, p.used, d.ptr, d.used);
        x.studio_free(p.ptr, p.len);
        x.studio_free(d.ptr, d.len);
        if (!ok) throw new Error(`the compiler refused ${f.path}`);
      }
      return true;
    });
  }

  function runCheck(main) {
    return withCompiler((x) => {
      const p = put(x, enc.encode(main));
      const status = x.studio_check(p.ptr, p.used);
      x.studio_free(p.ptr, p.len);
      if (status < 0) throw new Error('the compiler ran out of memory');
      const bytes = new Uint8Array(x.memory.buffer, x.studio_result_ptr(), x.studio_result_len());
      return JSON.parse(new TextDecoder().decode(bytes));
    });
  }

  // ------------------------------------------------------------ opening projects

  function chooseMain(files) {
    const scripts = files.map((f) => f.path).filter((p) => /\.bespoke$/i.test(p)).sort();
    for (const want of ['scripts/main.bespoke', 'main.bespoke']) if (scripts.includes(want)) return want;
    const mains = scripts.filter((p) => p.endsWith('/main.bespoke')).sort((a, b) => a.split('/').length - b.split('/').length);
    return mains[0] || scripts[0] || null;
  }

  function addFile(acc, path, bytes, extra) {
    if (acc.files.length >= MAX_FILES) { acc.skipped.push({ path, why: `over the ${MAX_FILES}-file limit` }); return; }
    if (bytes.length > MAX_FILE_BYTES) { acc.skipped.push({ path, why: 'larger than 16 MiB' }); return; }
    if (acc.total + bytes.length > MAX_TOTAL_BYTES) { acc.skipped.push({ path, why: 'past the 64 MiB project limit' }); return; }
    if (acc.files.some((f) => f.path === path)) { acc.skipped.push({ path, why: 'a second file with this name' }); return; }
    acc.total += bytes.length;
    acc.files.push({ path, bytes, dirty: false, ...extra });
  }

  async function readHandleTree(dir) {
    const acc = { files: [], skipped: [], total: 0 };
    async function walk(d, prefix, depth) {
      const entries = [];
      for await (const entry of d.values()) entries.push(entry);
      entries.sort((a, b) => (a.name < b.name ? -1 : a.name > b.name ? 1 : 0));
      for (const h of entries) {
        if (h.name.startsWith('.')) continue;
        const path = prefix ? `${prefix}/${h.name}` : h.name;
        if (h.kind === 'directory') {
          if (SKIP_DIRS.has(h.name)) continue;
          if (depth >= MAX_DEPTH) { acc.skipped.push({ path, why: 'folders nested too deep' }); continue; }
          await walk(h, path, depth + 1);
        } else if (KEEP.test(h.name)) {
          try {
            const file = await h.getFile();
            if (file.size > MAX_FILE_BYTES) { acc.skipped.push({ path, why: 'larger than 16 MiB' }); continue; }
            addFile(acc, path, new Uint8Array(await file.arrayBuffer()), { handle: h, lastModified: file.lastModified });
          } catch (err) {
            acc.skipped.push({ path, why: errText(err) });
          }
        }
      }
    }
    await walk(dir, '', 0);
    return acc;
  }

  async function openDirectory(handle) {
    let acc;
    try {
      acc = await readHandleTree(handle);
    } catch (err) {
      await desk.requester(projectWindow(), { title: 'Open folder', tone: 'fault', lines: [`The folder "${handle.name}" could not be read.`, errText(err)] });
      return false;
    }
    return finishOpen({ name: handle.name, handle, writable: true }, acc);
  }

  async function openFileHandles(handles) {
    const acc = { files: [], skipped: [], total: 0 };
    for (const h of handles) {
      try {
        const file = await h.getFile();
        addFile(acc, h.name, new Uint8Array(await file.arrayBuffer()), { handle: h, lastModified: file.lastModified });
      } catch (err) {
        acc.skipped.push({ path: h.name, why: errText(err) });
      }
    }
    return finishOpen({ name: 'Opened files', handle: null, writable: true }, acc);
  }

  // The fallback for browsers without the file system access API: a file input. What it reads
  // cannot be written back, so the project is marked read-only and Save says so.
  async function openFileList(list, folder) {
    const acc = { files: [], skipped: [], total: 0 };
    const all = [...list].sort((a, b) => ((a.webkitRelativePath || a.name) < (b.webkitRelativePath || b.name) ? -1 : 1));
    let name = 'Opened files';
    for (const file of all) {
      let path = file.name;
      if (folder && file.webkitRelativePath) {
        const parts = file.webkitRelativePath.split('/');
        name = parts[0];
        path = parts.slice(1).join('/');
        if (parts.slice(1, -1).some((p) => p.startsWith('.') || SKIP_DIRS.has(p))) continue;
      }
      if (!KEEP.test(path) || path.split('/').pop().startsWith('.')) continue;
      try {
        addFile(acc, path, new Uint8Array(await file.arrayBuffer()), { handle: null, lastModified: file.lastModified });
      } catch (err) {
        acc.skipped.push({ path, why: errText(err) });
      }
    }
    return finishOpen({ name, handle: null, writable: false }, acc);
  }

  async function finishOpen(meta, acc) {
    S.project = { ...meta, files: acc.files, skipped: acc.skipped, main: chooseMain(acc.files) };
    S.result = null;
    for (const w of [...screen.windows]) if (w.id.startsWith('script:') || w.id === 'diagnostics') w.close();
    renderProject();
    if (acc.skipped.length) {
      await desk.requester(projectWindow(), {
        title: 'Open',
        lines: [`${acc.skipped.length} file(s) were not opened:`, ...acc.skipped.slice(0, 6).map((s) => `${s.path}: ${s.why}`)],
      });
    }
    if (!acc.files.length) {
      await desk.requester(projectWindow(), { title: 'Open', lines: [`"${meta.name}" holds no .bespoke scripts or .png images.`] });
      return false;
    }
    if (loadIntoCompiler() === null) return true;
    await check();
    return true;
  }

  async function openFolder() {
    if (window.showDirectoryPicker) {
      let handle;
      try { handle = await window.showDirectoryPicker({ id: 'bespoke-project', mode: 'read' }); } catch (err) {
        if (err && err.name === 'AbortError') return false;
        throw err;
      }
      return openDirectory(handle);
    }
    return pickInput(true);
  }

  async function openFiles() {
    if (window.showOpenFilePicker) {
      let handles;
      try {
        handles = await window.showOpenFilePicker({
          id: 'bespoke-files', multiple: true,
          types: [{ description: 'BeSpoke scripts and images', accept: { 'text/plain': ['.bespoke'], 'image/png': ['.png'] } }],
        });
      } catch (err) {
        if (err && err.name === 'AbortError') return false;
        throw err;
      }
      return openFileHandles(handles);
    }
    return pickInput(false);
  }

  function pickInput(folder) {
    return new Promise((resolve) => {
      const input = document.createElement('input');
      input.type = 'file';
      input.multiple = true;
      if (folder) input.webkitdirectory = true; else input.accept = '.bespoke,.png';
      input.hidden = true;
      input.addEventListener('change', async () => { input.remove(); resolve(await openFileList(input.files, folder)); });
      input.addEventListener('cancel', () => { input.remove(); resolve(false); });
      document.body.appendChild(input);
      input.click();
    });
  }

  // ------------------------------------------------------------ check

  async function check() {
    const win = projectWindow();
    if (!S.project) { await desk.requester(win, { title: 'Check', lines: ['Open a project first.'] }); return null; }
    if (!S.project.main) { await desk.requester(win, { title: 'Check', lines: ['This project has no .bespoke script to check.'] }); return null; }
    if (S.compiler.state !== 'ready') {
      const pick = await desk.requester(win, {
        title: 'Check', tone: 'fault',
        lines: ["The compiler isn't running, so scripts can't be checked.", S.compiler.error],
        buttons: [{ id: 'retry', label: 'Retry' }, { id: 'ok', label: 'OK' }],
      });
      if (pick === 'retry' && await startCompiler() && loadIntoCompiler() !== null) return check();
      return null;
    }
    document.body.classList.add('busy');
    const r = runCheck(S.project.main);
    document.body.classList.remove('busy');
    if (!r) return null;
    S.result = r;
    renderProject();
    renderDiagnostics(!r.valid || r.warnings.length > 0);
    if (!r.valid) {
      const where = r.line ? `${r.file}, line ${r.line}, column ${r.column}` : r.file;
      const lines = [where, r.message];
      if (r.suggestion) lines.push(`Did you mean "${r.suggestion}"?`);
      const found = r.line && findFile(r.file);
      const pick = await desk.requester(win, {
        title: 'Script check', tone: 'fault', lines,
        buttons: found ? [{ id: 'show', label: 'Show line' }, { id: 'ok', label: 'OK' }] : [{ id: 'ok', label: 'OK' }],
      });
      if (pick === 'show') openScript(r.file, r.line, r.column);
    }
    return r;
  }

  function findFile(path) {
    return S.project && S.project.files.find((f) => f.path === path);
  }

  // ------------------------------------------------------------ save

  // Writes only files an editor changed. P47-01 has no editors, so nothing is ever dirty; Save
  // still compares every opened file with the disk, so an author learns when another program
  // changed a file underneath the Studio before any editor could overwrite it.
  async function save() {
    const win = projectWindow();
    const p = S.project;
    if (!p) { await desk.requester(win, { title: 'Save', lines: ['No project is open.'] }); return { written: 0, changed: [] }; }
    const dirty = p.files.filter((f) => f.dirty);
    if (dirty.length) throw new Error('an edited file has no writer yet');
    const changed = [];
    if (p.writable) {
      for (const f of p.files) {
        if (!f.handle) continue;
        try {
          const disk = new Uint8Array(await (await f.handle.getFile()).arrayBuffer());
          if (!sameBytes(disk, f.bytes)) changed.push(f.path);
        } catch (err) {
          changed.push(`${f.path} (${errText(err)})`);
        }
      }
    }
    if (changed.length) {
      const pick = await desk.requester(win, {
        title: 'Save', lines: [`${changed.length} file(s) changed on disk since you opened them:`, ...changed.slice(0, 6), 'Nothing was written.'],
        buttons: [{ id: 'reload', label: 'Reload' }, { id: 'leave', label: 'Leave' }],
      });
      if (pick === 'reload' && p.handle) await openDirectory(p.handle);
    } else {
      const lines = [`Nothing to save: ${p.files.length} file(s) are unchanged.`];
      if (!p.writable) lines.push('This browser opened the folder read-only, so the Studio could not write to it anyway.');
      await desk.requester(win, { title: 'Save', lines });
    }
    return { written: 0, changed };
  }

  function sameBytes(a, b) {
    if (a.length !== b.length) return false;
    for (let i = 0; i < a.length; i += 1) if (a[i] !== b[i]) return false;
    return true;
  }

  // ------------------------------------------------------------ windows

  const screen = desk.screen(`BeSpoke Studio ${STUDIO_BUILD.version}`);
  let projectWin = null;

  function line(text, cls) {
    const row = document.createElement('div');
    row.className = `line ${cls || ''}`.trim();
    row.appendChild(desk.label(text));
    return row;
  }

  function buttons(win, list) {
    const row = document.createElement('div');
    row.className = 'row';
    for (const [id, text] of list) row.appendChild(desk.button(win, id, text));
    return row;
  }

  function projectWindow() {
    if (projectWin) return projectWin;
    projectWin = desk.window(screen, {
      id: 'project', title: 'Project', x: 16, y: 16, w: 460, h: 330, minW: 220, minH: 140,
      onMessage: async (msg) => {
        if (msg.kind === 'close') { projectWin.close(); projectWin = null; return; }
        if (msg.kind === 'resize') { renderProject(); return; }
        if (msg.kind !== 'gadget') return;
        if (msg.id.startsWith('main:')) { S.project.main = msg.id.slice(5); S.result = null; renderProject(); await check(); return; }
        await command(msg.id);
      },
    });
    renderProject();
    return projectWin;
  }

  function cols(win) {
    return Math.max(12, Math.floor((win.rect.w - 16 * desk.px()) / (desk.advance * desk.px())));
  }

  function fit(text, n) {
    const chars = [...text];
    return chars.length <= n ? text : `${chars.slice(0, Math.max(1, n - 3)).join('')}...`;
  }

  function renderProject() {
    const win = projectWin;
    if (!win) return;
    const n = cols(win);
    const out = [];
    const p = S.project;
    if (S.compiler.state === 'unavailable') {
      out.push(line(fit(`Compiler: not running (${S.compiler.error})`, n), 'err'));
      out.push(buttons(win, [['retry', 'Retry']]));
    } else if (S.compiler.state === 'loading') {
      out.push(line('Compiler: starting...'));
    }
    if (!p) {
      out.push(line('No project is open.'));
      out.push(buttons(win, [['open-folder', 'Open folder'], ['open-files', 'Open files']]));
    } else {
      out.push(line(fit(`Folder: ${p.name}${p.writable ? '' : ' (read-only)'}`, n)));
      out.push(line(fit(`Script: ${p.main || 'none'}`, n)));
      const list = document.createElement('div');
      list.className = 'list';
      for (const f of p.files.filter((x) => /\.bespoke$/i.test(x.path))) {
        const b = desk.button(win, `main:${f.path}`, fit(`${f.path === p.main ? '> ' : '  '}${f.path}`, n - 2), { cls: 'item' });
        if (f.path === p.main) b.classList.add('selected');
        list.appendChild(b);
      }
      out.push(list);
      const r = S.result;
      if (r) {
        const counts = `${r.scenes} scene(s), ${r.routines} routine(s), ${r.rules} rule(s)`;
        const warn = r.warnings.length ? `, ${r.warnings.length} warning(s)` : '';
        out.push(line(fit(r.valid ? `Valid: ${counts}${warn}` : `1 error${warn}`, n), r.valid ? '' : 'err'));
      }
      out.push(buttons(win, [['check', 'Check'], ['save', 'Save'], ['open-folder', 'Open folder']]));
    }
    win.body.replaceChildren(...out);
  }

  let diagWin = null;
  function renderDiagnostics(open) {
    const r = S.result;
    if (!diagWin && !open) return;
    if (!diagWin) {
      const a = screen.area.getBoundingClientRect();
      diagWin = desk.window(screen, {
        id: 'diagnostics', title: 'Diagnostics', x: Math.min(500, a.width * 0.4), y: 40, w: 520, h: 220, minW: 200, minH: 100,
        onMessage: (msg) => {
          if (msg.kind === 'close') { diagWin.close(); diagWin = null; return; }
          if (msg.kind === 'resize') { renderDiagnostics(false); return; }
          if (msg.kind === 'gadget' && msg.id.startsWith('at:')) {
            const [, file, l, c] = msg.id.split('\u0000');
            openScript(file, Number(l), Number(c));
          }
        },
      });
    }
    const n = cols(diagWin);
    const out = [];
    if (!r) out.push(line('No check has run yet.'));
    else {
      const items = [];
      if (!r.valid) items.push({ ...r, tag: 'error' });
      for (const w of r.warnings) items.push({ ...w, tag: 'warning' });
      if (!items.length) out.push(line(fit(`No problems in ${r.main}.`, n)));
      const list = document.createElement('div');
      list.className = 'list';
      for (const it of items) {
        const text = it.line ? `${it.file}:${it.line}:${it.column} ${it.tag}: ${it.message}` : `${it.file} ${it.tag}: ${it.message}`;
        const b = desk.button(diagWin, `at:\u0000${it.file}\u0000${it.line}\u0000${it.column}`, fit(text, n - 2), { cls: `item ${it.tag === 'error' ? 'err' : ''}` });
        b.setAttribute('aria-label', text);
        list.appendChild(b);
      }
      out.push(list);
    }
    diagWin.body.replaceChildren(...out);
  }

  // A read-only view of one project file with the diagnostic's line marked and a caret under
  // its column. The text is decoded for display only; the bytes the project holds never change.
  function openScript(path, lineNo, column) {
    const f = findFile(path);
    if (!f) { desk.requester(projectWindow(), { title: 'Show line', lines: [`${path} is not in the opened project.`] }); return null; }
    const id = `script:${path}`;
    let win = screen.windows.find((w) => w.id === id);
    if (!win) {
      let text = new TextDecoder('utf-8').decode(f.bytes);
      if (text.charCodeAt(0) === 0xfeff) text = text.slice(1);
      const lines = text.split(/\r\n|\n|\r/).map((l) => l.replace(/\t/g, '  '));
      const a = screen.area.getBoundingClientRect();
      const view = document.createElement('div');
      view.className = 'view';
      const rows = document.createElement('div');
      rows.className = 'rows';
      const state = { lines, mark: lineNo, column, top: 0 };
      const prop = desk.propGadget((top) => { state.top = top; draw(); });
      view.append(rows, prop.el);
      function visible() {
        return Math.max(1, Math.floor(rows.getBoundingClientRect().height / (9 * desk.px())));
      }
      function draw() {
        const vis = visible();
        const width = String(state.lines.length).length;
        const out = [];
        const n = Math.max(8, Math.floor(rows.getBoundingClientRect().width / (desk.advance * desk.px())));
        for (let i = state.top; i < state.lines.length && out.length < vis; i += 1) {
          const no = i + 1;
          out.push(line(fit(`${String(no).padStart(width)} ${state.lines[i]}`, n), no === state.mark ? 'mark' : ''));
          if (no === state.mark && state.column > 0 && out.length < vis) {
            out.push(line(`${' '.repeat(width + state.column)}^`, 'err'));
          }
        }
        rows.replaceChildren(...out);
        prop.set(state.lines.length + (state.mark ? 1 : 0), vis, state.top);
      }
      rows.addEventListener('wheel', (e) => { e.preventDefault(); prop.moveTo(state.top + Math.sign(e.deltaY) * 3); }, { passive: false });
      win = desk.window(screen, {
        id, title: path, x: Math.min(120, a.width * 0.1), y: 90, w: Math.min(640, a.width), h: Math.min(320, a.height - 90), minW: 160, minH: 90,
        onMessage: (msg) => {
          if (msg.kind === 'close') win.close();
          if (msg.kind === 'resize') draw();
          if (msg.kind === 'goto') { state.mark = msg.line; state.column = msg.column; state.top = Math.max(0, msg.line - 1 - Math.floor(visible() / 2)); draw(); }
        },
      });
      win.body.appendChild(view);
    }
    win.toFront();
    win.activate();
    win.port.post({ kind: 'goto', line: lineNo, column });
    return win;
  }

  // Held menus need a secondary mouse button; where the Menus gadget shows instead (touch, or a
  // narrow window), the hint names that.
  function menuHint() {
    return window.matchMedia('(max-width: 700px), (pointer: coarse)').matches
      ? 'Tap Menus for the menus.' : 'Hold the right mouse button for menus.';
  }

  let aboutWin = null;
  function about() {
    if (aboutWin) { aboutWin.toFront(); return aboutWin; }
    const a = screen.area.getBoundingClientRect();
    aboutWin = desk.window(screen, {
      id: 'about', title: 'About the Studio', x: Math.max(0, a.width - 420), y: Math.max(0, a.height - 230), w: 400, h: 210, minW: 200, minH: 100,
      onMessage: async (msg) => {
        if (msg.kind === 'close' || (msg.kind === 'gadget' && msg.id === 'about-ok')) { aboutWin.close(); aboutWin = null; return; }
        if (msg.kind === 'gadget') await command(msg.id);
      },
    });
    const n = cols(aboutWin);
    const lines = [
      `BeSpoke Studio ${STUDIO_BUILD.version}`,
      'Open a project folder to check its scripts.',
      menuHint(),
      'Drag the screen down by its title bar.',
    ];
    if (!S.storage) lines.push('This browser will not keep settings.');
    const out = [];
    for (const l of lines) for (const part of desk.wrapText(l, n)) out.push(line(part));
    out.push(buttons(aboutWin, [['open-folder', 'Open folder'], ['about-ok', 'OK']]));
    aboutWin.body.replaceChildren(...out);
    return aboutWin;
  }

  // ------------------------------------------------------------ menus and keys

  function menus() {
    const scale = (n) => ({ id: `scale-${n}`, label: `${S.scale === n ? '* ' : '  '}${n}x`, checked: S.scale === n });
    return [
      {
        title: 'Project',
        items: [
          { id: 'open-folder', label: 'Open folder...', key: 'O' },
          { id: 'open-files', label: 'Open files...' },
          { id: 'check', label: 'Check script', key: 'K' },
          { id: 'save', label: 'Save', key: 'S' },
          { id: 'about', label: 'About the Studio' },
        ],
      },
      {
        title: 'Window',
        items: [
          { id: 'win-project', label: 'Project' },
          { id: 'win-diagnostics', label: 'Diagnostics' },
        ],
      },
      { title: 'Settings', items: [scale(1), scale(2), scale(3)] },
    ];
  }

  async function command(id) {
    switch (id) {
      case 'open-folder': return openFolder();
      case 'open-files': return openFiles();
      case 'check': return check();
      case 'save': return save();
      case 'retry': if (await startCompiler() && S.project && loadIntoCompiler() !== null) await check(); return null;
      case 'about': return about();
      case 'win-project': { const w = projectWindow(); w.toFront(); w.activate(); return w; }
      case 'win-diagnostics': renderDiagnostics(true); diagWin.toFront(); return diagWin;
      default:
        if (id.startsWith('scale-')) { saveScale(Number(id.slice(6))); return null; }
        return null;
    }
  }

  desk.pickMenu = (item) => { command(item.id).catch(desk.onHandlerError); };

  document.addEventListener('keydown', (e) => {
    if (!(isMac ? e.metaKey : e.ctrlKey) || e.altKey || e.shiftKey) return;
    if (document.querySelector('.veil')) return;
    const key = e.key.toUpperCase();
    for (const menu of menus()) {
      for (const item of menu.items) {
        if (item.key === key) { e.preventDefault(); command(item.id).catch(desk.onHandlerError); return; }
      }
    }
  });

  // ------------------------------------------------------------ boot

  // The workspace comes up first and owes nothing to the compiler, a project, or a setting;
  // each of those is tried after it and reports through a requester or the fault panel.
  const badSetting = loadSettings();
  screen.setMenus(menus());
  projectWindow();
  about();
  S.ready = true;
  startCompiler();
  if (badSetting !== null) {
    desk.requester(projectWindow(), {
      title: 'Settings',
      lines: [`Your saved scale "${String(badSetting).slice(0, 40)}" can't be used.`, `The Studio is using ${DEFAULT_SCALE}x.`],
      buttons: [{ id: 'use', label: `Use ${DEFAULT_SCALE}x` }, { id: 'ok', label: 'OK' }],
    }).then((pick) => { if (pick === 'use') saveScale(DEFAULT_SCALE); });
  }

  // For tests and embedding hosts: the page's own state and the actions behind its gadgets.
  window.bespokePageState = () => ({ ready: S.ready });
  window.bespokeStudio = {
    version: STUDIO_BUILD.version,
    openDirectory,
    check,
    save,
    command,
    compilerReady: () => S.compiler.state !== 'loading',
    state: () => ({
      ready: S.ready,
      scale: S.scale,
      compiler: { ...S.compiler },
      project: S.project && {
        name: S.project.name,
        writable: S.project.writable,
        main: S.project.main,
        files: S.project.files.map((f) => ({ path: f.path, size: f.bytes.length })),
        skipped: S.project.skipped.slice(),
      },
      result: S.result,
      faults: S.faults.slice(),
      windows: screen.windows.map((w) => w.id),
      requester: (document.querySelector('.req') || { getAttribute: () => null }).getAttribute('aria-label'),
      fault: Boolean(document.querySelector('.fault')),
    }),
  };
}());
</script>
</body>
</html>
